<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Fomery · 餐桌筆記</title>
  <link rel="stylesheet" href="journal.css">
  <script type="module" src="journal.mjs?v=meal-journal"></script>
</head>
<body>
  <header class="shell masthead">
    <h1>餐桌筆記<span class="brand-dot">.</span></h1>
    <button type="button" class="account" id="login" hidden>Google 登入</button>
  </header>
  <main class="shell" id="main">
    <p id="status" role="status" hidden></p>
    <section id="view" aria-labelledby="view-title" aria-busy="true">
      <h2 id="view-title">朋友近況</h2>
      <p>載入中…</p>
    </section>
  </main>
  <nav aria-label="主要頁面">
    <button type="button" data-page="feed" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h5"/></svg><span>動態</span></button>
    <button type="button" data-page="friends"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m2-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 2 4v2"/></svg><span>好友</span></button>
    <button type="button" data-page="record"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>記錄</span></button>
    <button type="button" data-page="explore"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9c0 5-7 11-7 11S5 14 5 9a7 7 0 0 1 14 0Z"/><circle cx="12" cy="9" r="2"/></svg><span>探索</span></button>
    <button type="button" data-page="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>個人</span></button>
  </nav>
  <dialog id="meal-detail" aria-labelledby="detail-title">
    <form method="dialog"><button type="submit" aria-label="關閉">關閉</button></form>
    <div id="detail-body"></div>
  </dialog>
</body>
</html>
